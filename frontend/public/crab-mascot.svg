<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 130 220 220" width="220" height="220" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title>ETF pixel crab robot</title>
  <desc>Gold pixel-art crab robot with subtle idle floating, glowing antenna, and moving eyes on a transparent background.</desc>

  <defs>
    <style>
      svg {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .idleFloat { animation: idleFloat 2.2s ease-in-out infinite; }
      .idleGlow { animation: idleGlow 1.8s ease-in-out infinite; }
      .eyesIdle { animation: eyesIdle 3.6s steps(1, end) infinite; }

      @keyframes idleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes idleGlow {
        0%, 100% { opacity: .6; }
        50% { opacity: 1; }
      }
      @keyframes eyesIdle {
        0%, 18%, 100% { transform: translate(0,0); }
        19%, 31% { transform: translate(2px,0); }
        32%, 45% { transform: translate(-2px,0); }
        46%, 61% { transform: translate(0,1px); }
        62%, 78% { transform: translate(1px,-1px); }
        79%, 90% { transform: translate(0,0); }
      }
    </style>
  </defs>

  <g id="mascotWrap" class="idleFloat">
    <g id="antenna" class="idleGlow">
      <rect x="244" y="156" width="8" height="16" fill="#f2c661"/>
      <rect x="244" y="148" width="8" height="8" fill="#f2c661"/>
      <rect x="252" y="140" width="8" height="8" fill="#f2c661"/>
      <rect x="260" y="132" width="8" height="8" fill="#8fffd8"/>
    </g>

    <g id="body">
      <rect x="184" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="200" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="216" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="232" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="248" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="264" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="280" y="196" width="16" height="16" fill="#f3ca6a"/>
      <rect x="296" y="196" width="16" height="16" fill="#d39b2f"/>

      <rect x="184" y="212" width="16" height="16" fill="#f3ca6a"/>
      <rect x="200" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="216" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="232" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="248" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="264" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="280" y="212" width="16" height="16" fill="#f0bf57"/>
      <rect x="296" y="212" width="16" height="16" fill="#c98f25"/>

      <rect x="184" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="200" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="216" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="232" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="248" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="264" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="280" y="228" width="16" height="16" fill="#f0bf57"/>
      <rect x="296" y="228" width="16" height="16" fill="#c98f25"/>

      <rect x="184" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="200" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="216" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="232" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="248" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="264" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="280" y="244" width="16" height="16" fill="#edb64a"/>
      <rect x="296" y="244" width="16" height="16" fill="#be8220"/>

      <rect x="200" y="260" width="16" height="16" fill="#e3aa3c"/>
      <rect x="216" y="260" width="16" height="16" fill="#e3aa3c"/>
      <rect x="232" y="260" width="16" height="16" fill="#e3aa3c"/>
      <rect x="248" y="260" width="16" height="16" fill="#e3aa3c"/>
      <rect x="264" y="260" width="16" height="16" fill="#e3aa3c"/>
      <rect x="280" y="260" width="16" height="16" fill="#b87716"/>
    </g>

    <g id="eyes" class="eyesIdle">
      <rect x="216" y="228" width="16" height="16" fill="#0f1114"/>
      <rect x="264" y="228" width="16" height="16" fill="#0f1114"/>
    </g>

    <g id="leftClaw">
      <rect x="168" y="228" width="16" height="16" fill="#eab250"/>
      <rect x="152" y="244" width="16" height="16" fill="#eab250"/>
      <rect x="168" y="244" width="16" height="16" fill="#eab250"/>
      <rect x="168" y="260" width="16" height="16" fill="#d5972f"/>
    </g>

    <g id="rightArm">
      <rect x="312" y="228" width="16" height="16" fill="#eab250"/>
      <rect x="328" y="244" width="16" height="16" fill="#eab250"/>
      <rect x="312" y="244" width="16" height="16" fill="#eab250"/>
      <rect x="312" y="260" width="16" height="16" fill="#d5972f"/>
    </g>

    <g id="legs">
      <rect x="188" y="292" width="16" height="16" fill="#eab250"/>
      <rect x="188" y="308" width="16" height="16" fill="#d5972f"/>
      <rect x="212" y="292" width="16" height="16" fill="#eab250"/>
      <rect x="212" y="308" width="16" height="16" fill="#d5972f"/>
      <rect x="236" y="292" width="16" height="16" fill="#eab250"/>
      <rect x="236" y="308" width="16" height="16" fill="#d5972f"/>
      <rect x="260" y="292" width="16" height="16" fill="#eab250"/>
      <rect x="260" y="308" width="16" height="16" fill="#d5972f"/>
      <rect x="284" y="292" width="16" height="16" fill="#eab250"/>
      <rect x="284" y="308" width="16" height="16" fill="#d5972f"/>
    </g>
  </g>
</svg>
